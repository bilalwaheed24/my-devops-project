<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choti Si Pyari Practice ✨</title>
  <style>
    /* 🌸 Soft & Clean Variables */
    :root {
      --bg: #fdf8f5;
      --card: #ffffff;
      --pink: #e86b8d;
      --pink-hover: #d15274;
      --text: #3d3d3d;
      --shadow: 0 8px 24px rgba(232, 107, 141, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background: var(--card);
      padding: 2rem;
      border-radius: 1.5rem;
      box-shadow: var(--shadow);
      text-align: center;
      max-width: 360px;
      width: 100%;
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-4px); }

    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    p { margin-bottom: 1.5rem; line-height: 1.5; font-size: 0.95rem; }

    .btn {
      background: var(--pink);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .btn:hover { background: var(--pink-hover); transform: scale(1.03); }
    .btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

    #msg {
      margin-top: 1.2rem;
      font-weight: 500;
      color: var(--pink);
      min-height: 1.4em;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <main class="card" role="main">
    <h1>🌼 Hello, Coder!</h1>
    <p>Yeh tumhara chota practice page hai.<br>Isko edit karo, break karo, phir fix karo! 💻✨</p>
    
    <button class="btn" id="magicBtn">Click for Magic ✨</button>
    <p id="msg" aria-live="polite"></p>
  </main>

  <script>
    // 🪄 Tiny Practice Script
    const btn = document.getElementById('magicBtn');
    const msg = document.getElementById('msg');
    
    const lines = [
      "You're doing great! 🌟",
      "Keep going, future expert! 🚀",
      "Every bug fixed = +1 confidence 💪",
      "Code like a pro, chill like a boss ☕"
    ];
    let i = 0;

    btn.addEventListener('click', () => {
      msg.style.opacity = '0';
      setTimeout(() => {
        msg.textContent = lines[i % lines.length];
        msg.style.opacity = '1';
        i++;
      }, 150);
    });
  </script>

</body>
</html>
