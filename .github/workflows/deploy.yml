name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Jab bhi main branch par push hoga, ye chalega

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # Updated from v3 to v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3  # Updated to latest version
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Server ke andar ja kar ye commands chalengi
            cd /var/www/html
            # Agar permissions ka masla ho toh folder owner change karna par sakta hai
            sudo chown -R ubuntu:ubuntu /var/www/html
            echo "Deploying new version..."
            
      - name: Copy index.html to EC2
        uses: appleboy/scp-action@v0.1.7  # Updated to latest version
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "index.html"
          target: "/var/www/html/"
